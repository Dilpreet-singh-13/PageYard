{% for note in notes_list %} 
  {% include 'notes/partials/partial_note_item.html' with note=note %} 
{% empty %}
  <div class="col-span-full py-16 px-4 flex flex-col items-center justify-center bg-base-100/70 border border-base-200/80 rounded-2xl text-center">
    <div class="size-12 rounded-2xl bg-base-200/80 flex items-center justify-center mb-3 text-base-content/50 border border-base-300/40">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-base-content/50">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
      </svg>
    </div>
    <h3 class="font-display text-base font-semibold text-base-content">No pages found</h3>
    <p class="text-xs text-base-content/60 mt-1 max-w-sm">No notes match your current query or filters. Try adjusting your search criteria.</p>
  </div>
{% endfor %} 

{% if notes_list.has_next %}
  <div class="col-span-full flex justify-center items-center py-8" id="load-more-container">
    <button
      class="btn btn-sm px-6 rounded-lg bg-base-100 border border-base-300/60 shadow-xs hover:border-primary/50 hover:text-primary transition-all text-xs font-semibold gap-2"
      hx-get="{% if request.resolver_match.url_name == 'notes_search_page' %}{% url 'notes:notes_search_page' %}{% else %}{% url 'notes:all_notes_view' %}{% endif %}?page={{ notes_list.next_page_number }}"
      {% if request.resolver_match.url_name == 'notes_search_page' %}hx-include="#search-form"{% endif %}
      hx-target="#load-more-container"
      hx-swap="outerHTML"
      hx-indicator="#loading-spinner"
    >
      <span>Load More Pages</span>
      <span id="loading-spinner" class="loading loading-spinner loading-xs text-primary htmx-indicator"></span>
    </button>
  </div>
{% endif %}
