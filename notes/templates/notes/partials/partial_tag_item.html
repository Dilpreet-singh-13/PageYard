<li id="tag-{{ tag.id }}"
    x-data="{ curr_tag_id: '{{ tag.id }}', editing: false }"
    class="relative rounded-xl transition-all duration-150 border border-transparent"
    :class="editing ? 'bg-base-200/60 ring-1 ring-primary/30 p-2' : 'hover:bg-base-200/50 hover:border-base-200/80'">

  <div x-show="!editing" class="flex items-center justify-between px-3.5 py-2.5 w-full gap-2">
    <div class="flex items-center gap-3 flex-1 min-w-0">
      <div class="size-7 rounded-lg bg-secondary/10 text-secondary flex items-center justify-center shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-3.5">
          <path fill-rule="evenodd" d="M4.5 2A2.5 2.5 0 0 0 2 4.5v3.879a2.5 2.5 0 0 0 .732 1.767l7.5 7.5a2.5 2.5 0 0 0 3.536 0l3.878-3.878a2.5 2.5 0 0 0 0-3.536l-7.5-7.5A2.5 2.5 0 0 0 8.38 2H4.5ZM5 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
        </svg>
      </div>

      <span class="text-sm font-semibold text-base-content truncate max-w-[220px]" title="{{ tag.name }}">
        {{ tag.name }}
      </span>

      <a href="{% url 'notes:notes_search_page' %}?tag={{ tag.id }}"
         class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium bg-base-200/80 text-base-content/60 hover:text-primary hover:bg-primary/10 border border-base-300/40 transition-colors shrink-0"
         title="View notes with this tag">
        {{ tag.notes.count }} page{{ tag.notes.count|pluralize }}
      </a>
    </div>

    <div class="flex items-center gap-1 shrink-0">
      {# Edit button #}
      <button @click="editing = true;
                      $store.tag_ui.start_edit(curr_tag_id);
                      $nextTick(() => { 
                        const el = $refs.editNameInput;
                        el.focus();
                        el.setSelectionRange(el.value.length, el.value.length);
                      });"
              :disabled="$store.tag_ui.editTagId && $store.tag_ui.editTagId !== curr_tag_id"
              :class="$store.tag_ui.editTagId && $store.tag_ui.editTagId !== curr_tag_id ? 'opacity-40 pointer-events-none' : ''"
              class="btn btn-xs btn-ghost btn-square text-base-content/50 hover:text-primary hover:bg-primary/10 rounded-lg transition-colors"
              title="Rename tag"
              type="button">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-3.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
        </svg>
      </button>

      {# Delete button #}
      <button class="btn btn-xs btn-ghost btn-square text-base-content/50 hover:text-error hover:bg-error/10 rounded-lg transition-colors"
              type="button"
              :disabled="$store.tag_ui.editTagId && $store.tag_ui.editTagId !== curr_tag_id"
              :class="$store.tag_ui.editTagId && $store.tag_ui.editTagId !== curr_tag_id ? 'opacity-40 pointer-events-none' : ''"
              hx-delete="{% url 'notes:tag_delete_page' tag.id %}"
              hx-target="#tag-{{ tag.id }}"
              hx-swap="outerHTML"
              hx-confirm="Delete '{{ tag.name }}'? It will be removed from {{ tag.notes.count }} note{{ tag.notes.count|pluralize }}."
              title="Delete tag">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-3.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
        </svg>
      </button>
    </div>
  </div>

  {# Inline edit form #}
  <div x-show="editing" x-cloak class="p-1">
    <form hx-post="{% url 'notes:tag_edit_page' tag.id %}"
          hx-target="#tag-{{ tag.id }}"
          hx-swap="outerHTML"
          @htmx:after-request="if($event.detail.successful) { editing = false; $store.tag_ui.stop_edit(); }"
          class="flex items-center gap-2">
      {% csrf_token %}

      <label for="tag-name-input-{{ tag.id }}" class="sr-only">Tag Name</label>

      <input x-ref="editNameInput"
             id="tag-name-input-{{ tag.id }}"
             type="text"
             name="name"
             value="{{ tag.name }}"
             required
             @keydown.escape="editing = false; $store.tag_ui.stop_edit();"
             class="input input-xs h-8 grow bg-base-100 border border-base-300 rounded-lg text-xs font-semibold focus:border-primary focus:outline-hidden px-2.5">

      <div class="flex items-center gap-1.5 shrink-0">
        <button type="submit" class="btn btn-xs btn-primary rounded-lg text-primary-content text-xs font-medium px-3 border-0">
          Save
        </button>

        <button @click="editing = false; $store.tag_ui.stop_edit()"
                type="button"
                class="btn btn-xs btn-ghost rounded-lg text-base-content/60 text-xs px-2">
          Cancel
        </button>
      </div>
    </form>
  </div>
</li>
